[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dep-timemachine"
version = "1.0.0"
description = "Travel back in time through your dependency history — find exactly when a CVE entered your project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["security", "dependencies", "cve", "vulnerability", "git", "supply-chain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "gitpython>=3.1",
    "packaging>=23.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.0", "respx>=0.21", "ruff>=0.4"]

[project.scripts]
dep-timemachine = "dep_timemachine.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=dep_timemachine --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["dep_timemachine"]
